data:
  - action: "$mdiHomeRoof"
    title: Home
    to: "/en"
  - action: "$mdiFolderOpen"
    nested:
      - action: "$mdiPaletteOutline"
        group: "design"
        child:
          - action: "$mdiCellphoneLink"
            title: Websites
            to: "/cases/design/websites"
          - action: "$mdiCellphoneCog"
            title: App Design
            to: "/cases/design/apps"
          - action: "$mdiVectorRadius"
            title: Logotypes
            to: "/cases/design/logo"
          - action: "$mdiVectorCurve"
            title: Illustrations
            to: "/cases/design/illustrations"
          - action: "$mdiEmailFastOutline"
            title: Newsletters
            to: "/cases/design/email"
          - action: "$mdiOrderBoolAscendingVariant"
            title: Quiz
            to: "/cases/design/quiz"
        title: Design
        to: "/cases/design"
      - action: "$mdiDevices"
        group: "dev"
        child:
          - action: "$mdiResponsive"
            title: Websites
            to: "/cases/dev/websites"
          - action: "$mdiTabletCellphone"
            disabled: true
            title: App Design
            to: "/cases/dev/apps"
          - action: "$mdiVectorBezier"
            title: HTML5 Banners
            to: "/cases/dev/banners"
          - action: "$mdiEmailSyncOutline"
            disabled: true
            title: Email
            to: "/cases/dev/email"
        title: Development
        to: "/cases/dev"
      - action: "$mdiDotsHorizontal"
        group: "works"
        child:
          - action: "$mdiPrinter3d"
            title: 3D Models
            to: "/works/modeling"
          - action: "$mdiCodeJson"
            title: Pure Code
            to: "/works/coding"
          - action: "$mdiPrinterOutline"
            title: Printing
            to: "/works/printing"
          - action: "$mdiVectorPolylineEdit"
            title: Photoshop
            to: "/works/photoshop"
          - action: "$mdiDraw"
            title: Drawings
            to: "/works/drawings"
        title: More
    title: Cases
    to: "/cases"
  - action: "$mdiScriptText"
    group: "pricing"
    nested:
      - action: "$mdiPaletteSwatchOutline"
        disabled: true
        title: Web Design
        to: "/pricing/design"
      - action: "$vsCode"
        disabled: true
        title: Development
        to: "/pricing/dev"
    title: Pricing
    to: "/pricing"
  - action: "$mdiAccount"
    nested:
      - action: "$mdiFileCertificateOutline"
        title: Certificates
        to: "/certificates"
      - action: "$mdiTimelineOutline"
        title: Timeline
        to: "/timeline"
      - action: "$mdiLightbulbOnOutline"
        title: Projects
        to: "/projects"
      - action: "$mdiContactsOutline"
        title: Contact
        to: "/contact"
      # - action: "$mdiBookOpenPageVariantOutline"
      #   title: Articles
      #   to: "/articles"
      - action: "$mdiDotsHorizontal"
        group: "more"
        child:
          - action: "$mdiVideoWirelessOutline"
            disabled: true
            title: Streams
            to: "/guest-live-streams"
          - action: "$mdiMicrophoneOutline"
            disabled: true
            title: Interviews
            to: "/interviews"
          - action: "$mdiPodcast"
            disabled: true
            title: Podcasts
            to: "/podcasts"
          - action: "$mdiAccountGroupOutline"
            disabled: true
            title: Conferences
            to: "/conferences"
        title: More
        to: "#"
    title: Author
    to: "#"
