data:
  - action: "$mdiHomeRoof"
    title: Главная
    to: "/"
  - action: "$mdiFolderOpen"
    nested:
      - action: "$mdiPaletteOutline"
        group: "design"
        child:
          - action: "$mdiCellphoneLink"
            title: Сайты
            to: "/cases/design/websites"
          - action: "$mdiCellphoneCog"
            title: Приложения
            to: "/cases/design/apps"
          - action: "$mdiVectorRadius"
            title: Логотипы
            to: "/cases/design/logo"
          - action: "$mdiVectorCurve"
            title: Иллюстрации
            to: "/cases/design/illustrations"
          - action: "$mdiEmailFastOutline"
            title: Email-рассылки
            to: "/cases/design/email"
          - action: "$mdiProgressCheck"
            title: Квиз-дизайн
            to: "/cases/design/quiz"
        title: Веб-дизайн
        to: "/cases/design"
      - action: "$mdiDevices"
        group: "dev"
        child:
          - action: "$mdiResponsive"
            title: Сайты
            to: "/cases/dev/websites"
          - action: "$mdiTabletCellphone"
            title: Приложения
            to: "/cases/dev/apps"
            disabled: true
          - action: "$mdiVectorBezier"
            title: HTML5 Баннеры
            to: "/cases/dev/banners"
          - action: "$mdiEmailSyncOutline"
            disabled: true
            title: Верстка писем
            to: "/cases/dev/email"
        title: Разработка
        to: "/cases/dev"
      - action: "$mdiDotsHorizontal"
        group: "works"
        child:
          - action: "$mdiPrinter3d"
            title: 3D Модели
            to: "/works/modeling"
          - action: "$mdiCodeJson"
            title: Кодинг
            to: "/works/coding"
          - action: "$mdiVectorPolylineEdit"
            title: Фотошоп
            to: "/works/photoshop"
          - action: "$mdiPrinterOutline"
            title: Полиграфия
            to: "/works/printing"
          - action: "$mdiDraw"
            title: Рисунки
            to: "/works/drawings"
        title: Еще
    title: Кейсы
    to: "/cases"
  - action: "$mdiScriptText"
    group: "pricing"
    nested:
      - action: "$mdiPaletteSwatchOutline"
        disabled: true
        title: Веб-дизайн
        to: "/pricing/design"
      - action: "$vsCode"
        disabled: true
        title: Разработка
        to: "/pricing/dev"
    title: Цены
    to: "/pricing"
  - action: "$mdiAccount"
    nested:
      - action: "$mdiFileCertificateOutline"
        title: Сертификаты
        to: "/certificates"
      - action: "$mdiTimelineOutline"
        title: Timeline
        to: "/timeline"
      - action: "$mdiLightbulbOnOutline"
        title: Проекты
        to: "/projects"
      - action: "$mdiContactsOutline"
        title: Контакты
        to: "/contact"
      # - action: "$mdiBookOpenPageVariantOutline"
      #   title: Статьи
      #   to: "/articles"
      - action: "$mdiDotsHorizontal"
        group: "more"
        child:
          - action: "$mdiVideoWirelessOutline"
            disabled: true
            title: Стримы
            to: "/guest-live-streams"
          - action: "$mdiMicrophoneOutline"
            disabled: true
            title: Интервью
            to: "/interviews"
          - action: "$mdiPodcast"
            disabled: true
            title: Подскасты
            to: "/podcasts"
          - action: "$mdiAccountGroupOutline"
            disabled: true
            title: Конференции
            to: "/conferences"
        title: Еще
        to: "#"
    title: Автор
    to: "#"
